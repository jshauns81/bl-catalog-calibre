name: Plugin release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff PyQt6
      - run: ruff check integrations/calibre tests
      - run: python -m pytest tests -q
      - run: python integrations/calibre/build_plugin.py
      - name: Validate release package and tag
        env:
          PYTHONPATH: integrations/calibre
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from bl_catalog_calibre.updates import PluginRelease, validate_package
          manifest = json.loads(Path('integrations/calibre/dist/bl-catalog-calibre.json').read_text())
          release = PluginRelease(manifest['tag'], '', '', manifest['sha256'], manifest['size'], tuple(manifest['minimum_calibre_version']))
          validate_package(release, Path('integrations/calibre/dist/bl-catalog-calibre.zip').read_bytes())
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == manifest['tag'], 'Tag and plugin version disagree'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: integrations/calibre/dist/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-release
          path: dist
      - name: Publish Stable or Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/bl-catalog-calibre.zip dist/bl-catalog-calibre.json dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md "${args[@]}"
